# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Kept modest so the build doesn't exhaust a low-memory machine.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m

# Keep memory pressure low on modest machines: no daemon left running, a single
# worker, and no parallel project builds. Slightly slower, much gentler on RAM.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=false

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# Real phones are ARM; dropping the x86/x86_64 emulator ABIs roughly halves the
# APK size and lowers memory pressure on low-end devices. Add x86/x86_64 back if
# you need to run the release build on an emulator.
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# Use this property to enable support to the new architecture.
# Kept OFF: the classic architecture is the most reliable on old phones
# (Android 5/6), and it also avoids the native build step that hard-codes a
# minimum of Android 7 in newer React Native.
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# Hermes is kept on: lower memory use and faster startup on low-end devices,
# and it supports Android 5.0+ in React Native 0.76.
hermesEnabled=true
